# Synchronisation du catalogue 1foTrade.
# 1foTrade dépose son fichier (EDI) sur la Storage Box Hetzner ; cette tâche récupère le plus récent
# toutes les heures, en SFTP chiffré avec un compte en lecture seule, puis l'importe dans Supabase
# (prix, stock, promotions et prix FCFA sont recalculés par la base).
#
# Secrets requis (Settings > Secrets and variables > Actions) :
#   STORAGEBOX_HOST, STORAGEBOX_USER, STORAGEBOX_PASSWORD   compte « lecture » de la Storage Box
#   SUPABASE_URL, SUPABASE_PUBLISHABLE_KEY, IMPORT_TOKEN    accès à l'API d'import de la base
name: Import catalogue 1foTrade

on:
  schedule:
    - cron: "17 * * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: import-1fotrade
  cancel-in-progress: false

jobs:
  import:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Récupérer le dernier fichier 1foTrade
        env:
          HOST: ${{ secrets.STORAGEBOX_HOST }}
          USER_NAME: ${{ secrets.STORAGEBOX_USER }}
          LFTP_PASSWORD: ${{ secrets.STORAGEBOX_PASSWORD }}
        run: |
          set -euo pipefail
          sudo apt-get install -y -qq lftp > /dev/null
          mkdir -p ~/.ssh incoming
          # Clé du serveur enregistrée avant connexion (port SSH des Storage Box : 23).
          ssh-keyscan -p 23 -t ed25519,rsa "$HOST" >> ~/.ssh/known_hosts 2>/dev/null
          # Liste complète (les erreurs de connexion font échouer la tâche au lieu d'être masquées).
          lftp --env-password -u "$USER_NAME" -p 23 "sftp://$HOST" -e "set sftp:auto-confirm no; find -l .; bye" > listing.txt
          echo "Contenu de la Storage Box (fichiers cachés et sous-dossiers compris) :"
          head -n 40 listing.txt
          LATEST=$(lftp --env-password -u "$USER_NAME" -p 23 "sftp://$HOST" -e "set sftp:auto-confirm no; cls -1 --sort=date -a; bye" \
            | grep -iE '\.(csv|txt)$' | head -n 1 || true)
          if [ -z "$LATEST" ]; then
            echo "Aucun fichier CSV déposé par 1foTrade pour l'instant."
            echo "FILE=" >> "$GITHUB_ENV"
            exit 0
          fi
          echo "Fichier le plus récent : $LATEST"
          lftp --env-password -u "$USER_NAME" -p 23 "sftp://$HOST" -e "get \"$LATEST\" -o incoming/catalogue.csv; bye"
          echo "FILE=incoming/catalogue.csv" >> "$GITHUB_ENV"

      - name: Format du fichier (structure seulement, prix masqués)
        if: env.FILE != ''
        run: |
          python3 - "$FILE" <<'PY'
          import csv, sys, re, collections
          rows = list(csv.DictReader(open(sys.argv[1], encoding="utf-8-sig", newline=""), delimiter=";"))
          print("Produits :", len(rows), "| colonnes :", list(rows[0].keys()))
          mask = lambda v: re.sub(r"\d", "9", v)
          print("Format des prix :", collections.Counter(mask(r["PRIX"]) for r in rows).most_common(4))
          print("Format des poids :", collections.Counter(mask(r["POIDS"]) for r in rows).most_common(3))
          print("Valeurs de stock :", collections.Counter(mask(r["STOCK"]) for r in rows).most_common(6))
          print("Catégories :", collections.Counter(r["CATEGORIE"] for r in rows).most_common(80))
          for r in rows[:3]:
              print({k: (mask(v) if k == "PRIX" else v) for k, v in r.items()})
          PY

      - name: Importer dans Supabase
        if: env.FILE != ''
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.SUPABASE_PUBLISHABLE_KEY }}
          IMPORT_TOKEN: ${{ secrets.IMPORT_TOKEN }}
        run: node scripts/import-fournisseur.mjs 1fotrade "$FILE"

      - name: Photos et fiches des nouveaux produits (Open Icecat)
        if: env.FILE != ''
        continue-on-error: true
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.SUPABASE_PUBLISHABLE_KEY }}
          IMPORT_TOKEN: ${{ secrets.IMPORT_TOKEN }}
        run: |
          timeout 20m node scripts/enrichir-icecat.mjs || true
          timeout 20m node scripts/galerie-icecat.mjs 1000 || true
