# Catalogue Picata (second fournisseur) : téléchargé avec la clé personnelle (secret PICATA_API_KEY, envoyée
# dans l'en-tête X-Api-Key, jamais dans l'adresse), puis importé dans Supabase comme celui de 1foTrade.
# La base retient ensuite, pour chaque produit (EAN), l'offre la plus intéressante entre les fournisseurs.
name: Import catalogue Picata

on:
  schedule:
    - cron: "47 */6 * * *"
  workflow_dispatch:
    inputs:
      mode:
        description: "inspecter (affiche l'en-tête du fichier) ou importer"
        default: importer

permissions:
  contents: read

concurrency:
  group: import-picata
  cancel-in-progress: false

jobs:
  import:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Télécharger le catalogue Picata
        env:
          PICATA_API_KEY: ${{ secrets.PICATA_API_KEY }}
        run: |
          set -euo pipefail
          mkdir -p incoming
          curl -sS -f --retry 3 -H "X-Api-Key: $PICATA_API_KEY" "https://www.picata.fr/pro/catalogue.csv?ean=1" \
            -o incoming/picata.csv -w "HTTP %{http_code} - %{size_download} octets\n"
          echo "Lignes : $(wc -l < incoming/picata.csv)"
          echo "Encodage : $(file -b --mime-encoding incoming/picata.csv)"

      - name: "Aperçu du format (noms de colonnes et types seulement, le dépôt est public)"
        if: github.event.inputs.mode == 'inspecter'
        run: |
          python3 - <<'PY'
          import csv, io, re
          raw = open("incoming/picata.csv", "rb").read()
          try:
              text = raw.decode("utf-8-sig"); enc = "utf-8"
          except UnicodeDecodeError:
              text = raw.decode("latin-1"); enc = "latin-1"
          sep = max([";", ",", "\t", "|"], key=lambda c: text.splitlines()[0].count(c))
          rows = list(csv.reader(io.StringIO(text), delimiter=sep))
          head, body = rows[0], rows[1:2001]
          print(f"Encodage {enc}, séparateur {sep!r}, {len(rows) - 1} lignes")
          for i, col in enumerate(head):
              vals = [r[i].strip() for r in body if i < len(r)]
              filled = [v for v in vals if v]
              num = sum(bool(re.fullmatch(r"-?\d+([.,]\d+)?", v)) for v in filled)
              ean = sum(bool(re.fullmatch(r"\d{8,14}", v)) for v in filled)
              distinct = len(set(filled))
              kind = "EAN" if filled and ean > 0.8 * len(filled) else "nombre" if filled and num > 0.8 * len(filled) else "texte"
              print(f"  {i:2d}. {col!r:32} {kind:7} rempli {len(filled)}/{len(vals)}, {distinct} valeurs distinctes")
          PY

      - name: Importer dans Supabase
        if: github.event.inputs.mode != 'inspecter'
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.SUPABASE_PUBLISHABLE_KEY }}
          IMPORT_TOKEN: ${{ secrets.IMPORT_TOKEN }}
        run: node scripts/import-fournisseur.mjs picata incoming/picata.csv
